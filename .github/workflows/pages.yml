name: 发布监控网页

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'monitor*.html'
      - 'index.html'
      - 'libsodium.js'
      - '.github/workflows/pages.yml'

concurrency:
  group: monitor-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Pages
        run: |
          mkdir -p _site
          cp monitor.html index.html libsodium.js _site/
          cp monitor-*.html _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
